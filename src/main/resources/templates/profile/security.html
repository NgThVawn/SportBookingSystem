<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::title}, ~{::content})}">
<head>
  <title>Bảo mật tài khoản | Arena Kinetic</title>
</head>
<body>

<div th:fragment="content" class="w-full">
  <main class="max-w-7xl mx-auto px-4 md:px-6 mt-12 mb-12">

    <section class="mb-12">
      <div class="relative h-32 w-full rounded-2xl overflow-hidden bg-zinc-900">
        <div class="absolute inset-0 bg-gradient-to-r from-primary/20 to-transparent"></div>
        <div class="absolute inset-0 flex items-center px-8">
          <h1 class="text-3xl font-black font-headline text-white uppercase italic tracking-tighter">Bảo mật hệ thống</h1>
        </div>
      </div>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
        <aside class="md:col-span-3">
            <div class="bg-surface-container-low p-2 rounded-2xl space-y-1">

                <a th:href="@{/profile}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-white transition-all font-headline font-bold no-underline">
                    <span class="material-symbols-outlined">person</span> Hồ sơ cá nhân
                </a>

                <a th:href="@{/booking/history}" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-white transition-all font-headline font-bold no-underline">
                    <span class="material-symbols-outlined">calendar_today</span> Lịch sử đặt sân
                </a>

                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-white transition-all font-headline font-bold no-underline">
                    <span class="material-symbols-outlined">notifications</span> Thông báo
                </a>

                <a th:href="@{/profile/security}" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary text-on-primary font-headline font-bold transition-all no-underline shadow-lg shadow-primary/20">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">security</span> Bảo mật
                </a>

                <div class="pt-4 mt-4 border-t border-outline-variant/20">
                    <form th:action="@{/auth/logout}" method="post" class="m-0">
                        <button type="submit" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-error hover:bg-error-container transition-all font-headline font-bold border-none bg-transparent cursor-pointer">
                            <span class="material-symbols-outlined">logout</span> Đăng xuất
                        </button>
                    </form>
                </div>

            </div>
        </aside>

      <div class="md:col-span-9 space-y-8">

        <div th:if="${success}" class="p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-700 rounded shadow-sm animate-fade-in font-bold uppercase text-xs tracking-widest">
          [[${success}]]
        </div>
        <div th:if="${error}" class="p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded shadow-sm animate-fade-in font-bold uppercase text-xs tracking-widest">
          [[${error}]]
        </div>

        <div class="bg-surface-container-lowest p-8 md:p-10 rounded-2xl shadow-sm border border-outline-variant/20">
          <h2 class="text-xl font-black font-headline mb-8 text-on-surface uppercase italic tracking-tight flex items-center gap-2">
            <span class="w-8 h-1 bg-primary"></span> Thay đổi mật khẩu
          </h2>

          <form th:action="@{/profile/change-password}" method="post" class="max-w-md space-y-6">
            <div class="space-y-2">
              <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1">Mật khẩu hiện tại</label>
              <input name="oldPassword" type="password" required
                     class="w-full px-4 py-4 bg-surface-container-highest border-none focus:ring-2 focus:ring-primary rounded-xl transition-all font-bold text-on-surface"/>
            </div>

            <div class="space-y-2">
              <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1">Mật khẩu mới</label>
              <input name="newPassword" type="password" required minlength="8" pattern=".{8,}"
                title="Mật khẩu mới phải có ít nhất 8 ký tự"
                oninvalid="this.setCustomValidity('Mật khẩu mới phải có ít nhất 8 ký tự')"
                oninput="this.setCustomValidity('')"
                     class="w-full px-4 py-4 bg-surface-container-highest border-none focus:ring-2 focus:ring-primary rounded-xl transition-all font-bold text-on-surface"/>
            </div>

            <div class="space-y-2">
              <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1">Xác nhận mật khẩu mới</label>
              <input name="confirmPassword" type="password" required
                     class="w-full px-4 py-4 bg-surface-container-highest border-none focus:ring-2 focus:ring-primary rounded-xl transition-all font-bold text-on-surface"/>
            </div>

            <div class="pt-4">
              <button type="submit" class="bg-primary text-on-primary px-10 py-4 rounded-xl font-black uppercase tracking-widest shadow-xl shadow-primary/20 hover:shadow-primary/40 transition-all active:scale-95 font-headline w-full md:w-auto">
                Cập nhật mật khẩu
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
