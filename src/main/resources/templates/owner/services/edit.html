<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chỉnh sửa dịch vụ đi kèm | Arena Kinetic Owner</title>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&family=Inter:wght@100..900&family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface": "#191c1d",
                        "surface": "#f8f9fa",
                        "primary": "#b02f00"
                    },
                    fontFamily: {
                        "headline": ["Epilogue"],
                        "body": ["Inter"],
                        "label": ["Lexend"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface font-body text-on-surface antialiased">

<div th:replace="~{owner/fragments/owner_sidebar :: sidebar('facilities')}"></div>

<main class="ml-64 min-h-screen p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-[1.5rem] border border-slate-100 shadow-sm overflow-hidden">
        <div class="px-8 py-6 border-b border-slate-100 bg-slate-50/70">
            <p class="text-xs uppercase tracking-widest font-bold text-slate-500 mb-1">Chỉnh sửa dịch vụ</p>
            <h1 class="font-headline text-3xl font-black text-slate-900" th:text="${service.name}">Dịch vụ</h1>
            <p class="text-sm text-slate-500 mt-1" th:text="${facility.name}">Cơ sở</p>
        </div>

        <form th:action="@{/owner/facilities/{fid}/services/{sid}/edit(fid=${facility.id},sid=${service.id})}" method="post" th:object="${editService}" class="px-8 py-8 space-y-6">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${error}" class="p-4 rounded-xl bg-red-50 border border-red-200 flex items-center gap-2 text-red-700 text-sm">
                <span class="material-symbols-outlined">error</span>
                <span th:text="${error}"></span>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Tên dịch vụ</label>
                <input th:field="*{name}" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-cyan-200 focus:border-cyan-500" required>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Mô tả</label>
                <textarea th:field="*{description}" rows="4" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-cyan-200 focus:border-cyan-500"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Giá (₫)</label>
                    <input type="number" min="1000" th:field="*{price}" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-cyan-200 focus:border-cyan-500" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Đơn vị</label>
                    <input th:field="*{unit}" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-cyan-200 focus:border-cyan-500" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Tồn kho</label>
                    <input type="number" min="0" th:field="*{stock}" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-cyan-200 focus:border-cyan-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Áp dụng cho</label>
                <select th:field="*{appliesToSportType}" class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-cyan-200 focus:border-cyan-500">
                    <option value="">Tất cả loại sân</option>
                    <option th:each="sport : ${sportTypes}" th:value="${sport}" th:text="${sport.displayName}"></option>
                </select>
            </div>

            <label class="flex items-center gap-2 text-sm text-slate-700 font-medium">
                <input type="checkbox" th:field="*{isActive}" class="rounded border-slate-300 text-cyan-600 focus:ring-cyan-400">
                Dịch vụ đang hoạt động
            </label>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                <a th:href="@{/owner/facilities/{fid}/services(fid=${facility.id})}" class="px-5 py-3 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50 text-decoration-none">Hủy</a>
                <button type="submit" class="px-5 py-3 rounded-xl bg-cyan-600 text-white font-bold text-sm hover:bg-cyan-700">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
