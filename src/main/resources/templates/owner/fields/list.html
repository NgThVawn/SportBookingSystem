<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fields Management</title>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <style>
        body { font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .back-link { margin-bottom: 10px; display: block; color: #007bff; text-decoration: none; font-weight: 500; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .btn { padding: 7px 12px; border-radius: 4px; border: none; cursor: pointer; text-decoration: none; font-size: 13px; color: white; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-create { background-color: #28a745; }
        .btn-edit { background-color: #007bff; }
        .btn-delete { background-color: #dc3545; }
        .btn-slots { background-color: #17a2b8; }
        
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border: 1px solid #dee2e6; text-align: left; }
        th { background-color: #343a40; color: white; font-weight: 600; }
        
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 11px; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .status-open { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-closed { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-maintenance { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        
        .actions form { display: inline-block; margin-right: 5px; }
        select.status-select { padding: 5px; font-size: 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; }
        
        .msg { padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .msg-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<a th:href="@{/owner/facilities}" class="back-link">← Back to Facilities List</a>

<div class="top-bar">
    <h2 th:text="'Fields for: ' + ${facility.name}">Fields</h2>
    <a th:href="@{/owner/facilities/{facId}/fields/create(facId=${facility.id})}" class="btn btn-create">+ Add New Field</a>
</div>

<div class="msg msg-success" th:if="${successMsg}" th:text="${successMsg}"></div>
<div class="msg msg-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

<table>
    <thead>
        <tr>
            <th>Field Name</th>
            <th>Sport Type</th>
            <th>Surface</th>
            <th>Price / Hour</th>
            <th>Duration</th>
            <th>Status</th>
            <th style="width: 380px;">Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="f : ${fields}">
            <td th:text="${f.name}" style="font-weight: bold; color: #333;"></td>
            <td>
                <span class="badge" style="background: #e9ecef; color: #495057;" 
                      th:text="${f.sportType.displayName}"></span>
            </td>
            <td th:text="${f.surfaceType != null ? f.surfaceType : 'N/A'}"></td>
            <td th:text="${#numbers.formatDecimal(f.pricePerHour, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
            <td th:text="${f.slotDuration} + ' min'"></td>
            
            <td class="status-cell">
                <span th:class="'badge status-' + ${#strings.toLowerCase(f.status)}" th:text="${f.status}"></span>
            </td>

            <td class="actions">
                <a th:href="@{/owner/facilities/{facId}/fields/{fieldId}/edit(facId=${facility.id}, fieldId=${f.id})}" 
                   class="btn btn-edit">Edit</a>
                
                <select class="status-select" th:onchange="'changeFieldStatus(' + ${facility.id} + ',' + ${f.id} + ', this.value)'">
                    <option value="OPEN" th:selected="${f.status.name() == 'OPEN'}">Set Open</option>
                    <option value="CLOSED" th:selected="${f.status.name() == 'CLOSED'}">Set Closed</option>
                    <option value="MAINTENANCE" th:selected="${f.status.name() == 'MAINTENANCE'}">Maintenance</option>
                </select>

                <a th:href="@{/owner/facilities/{facId}/fields/{fieldId}/slots(facId=${facility.id}, fieldId=${f.id})}" 
                   class="btn btn-slots">Slots</a>

                <form th:action="@{/owner/facilities/{facId}/fields/{fieldId}/delete(facId=${facility.id}, fieldId=${f.id})}" 
                      method="post" onsubmit="return confirm('Are you sure? All timeslots for this field will be lost!');">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(fields)}">
            <td colspan="7" style="text-align: center; color: #888;">No fields found in this facility.</td>
        </tr>
    </tbody>
</table>

<script>
    function changeFieldStatus(facId, fieldId, newStatus) {
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        // URL khớp với Controller: /owner/facilities/{facilityId}/fields/{id}/status
        fetch(`/owner/facilities/${facId}/fields/${fieldId}/status?status=${newStatus}`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken 
            }
        }).then(res => {
            if(res.ok) {
                // Reload trang để cập nhật màu sắc Badge và vị trí Dropdown chuẩn xác nhất
                window.location.reload();
            } else {
                alert("Error updating status. Please check your permissions.");
            }
        }).catch(err => {
            console.error(err);
            alert("Network error!");
        });
    }
</script>

</body>
</html>
