<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý khung giờ sân</title>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>
    
    <style>
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: auto; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        
        .card-sidebar { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: fit-content; }
        .card-sidebar h3 { margin-top: 0; color: #333; font-size: 1.2rem; border-bottom: 2px solid #007bff; padding-bottom: 10px; }
        
        .card-main { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        .slot-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-top: 20px; }
        .slot-box { border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; text-align: center; transition: all 0.3s ease; position: relative; }
        
        /* Trạng thái */
        .status-AVAILABLE { border-top: 5px solid #28a745; background: #fafffb; }
        .status-BOOKED { border-top: 5px solid #dc3545; background: #fffafa; opacity: 0.8; }
        .status-LOCKED { border-top: 5px solid #ffc107; background: #fffdf5; }
        .status-MAINTENANCE { border-top: 5px solid #6c757d; background: #f4f4f4; }

        .slot-time { font-weight: bold; font-size: 1rem; color: #2c3e50; margin-bottom: 8px; }
        
        /* Input chỉnh giá nhanh */
        .price-input-quick { 
            width: 100%; border: 1px dashed #28a745; padding: 4px; text-align: center; 
            color: #28a745; font-weight: bold; border-radius: 4px; background: transparent;
        }
        .price-input-quick:focus { outline: none; border-style: solid; background: white; }

        /* Select trạng thái nhanh */
        .status-select-quick { 
            width: 100%; margin-top: 8px; font-size: 11px; padding: 3px; 
            border-radius: 4px; border: 1px solid #ccc; cursor: pointer;
        }

        label { display: block; margin-top: 12px; font-size: 0.85rem; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn-success { background-color: #28a745; color: white; }
        .btn:hover { opacity: 0.9; }

        .alert { padding: 12px; border-radius: 5px; margin-bottom: 20px; border-left: 5px solid; }
        .alert-success { background: #d4edda; color: #155724; border-color: #28a745; }
        .alert-danger { background: #f8d7da; color: #721c24; border-color: #dc3545; }

        /* Hiệu ứng lưu thành công */
        .save-success { animation: flash-green 1s; }
        @keyframes flash-green {
            0% { background-color: #d4edda; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body>

<a th:href="@{/owner/facilities/{facId}/fields(facId=${facility.id})}" style="text-decoration: none; color: #007bff; font-weight: bold;">
    ← Quay lại danh sách sân
</a>

<div class="container" style="margin-top: 15px;">
    <div class="card-sidebar">
        <h3>📅 Chọn ngày xem</h3>
        <form th:action="@{/owner/facilities/{facId}/fields/{fieldId}/slots(facId=${facility.id}, fieldId=${field.id})}" method="get">
            <input type="date" name="date" th:value="${selectedDate}" onchange="this.form.submit()"/>
        </form>

        <h3 style="margin-top: 30px;">⚡ Tạo lịch hàng loạt</h3>
        <p style="font-size: 11px; color: #6c757d;">
            Mỗi khung giờ: <strong th:text="${field.slotDuration}"></strong> phút.
        </p>
        
        <form th:action="@{/owner/facilities/{facId}/fields/{fieldId}/slots/generate(facId=${facility.id}, fieldId=${field.id})}" 
              th:object="${genRequest}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            
            <label>Ngày bắt đầu & Kết thúc</label>
            <div style="display: flex; gap: 5px;">
                <input type="date" th:field="*{startDate}" required />
                <input type="date" th:field="*{endDate}" required />
            </div>
            
            <label>Khung giờ hoạt động</label>
            <div style="display: flex; gap: 5px;">
                <input type="time" th:field="*{dayStartTime}" required />
                <input type="time" th:field="*{dayEndTime}" required />
            </div>

            <label>Giá áp dụng cho loạt này (VNĐ)</label>
            <input type="number" th:field="*{priceOverride}" placeholder="Bỏ trống để lấy giá mặc định" />

            <button type="submit" class="btn btn-success" onclick="return confirm('Hệ thống sẽ tạo khung giờ cho các ngày đã chọn. Tiếp tục?')">
                Tạo khung giờ
            </button>
        </form>
    </div>

    <div class="card-main">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 15px;">
            <h2 style="margin:0;">
                Lịch: <span th:text="${field.name}" style="color: #007bff;"></span>
            </h2>
            <div style="text-align: right;">
                <div style="font-weight: bold; font-size: 1.1rem;" th:text="${#temporals.format(selectedDate, 'dd/MM/yyyy')}"></div>
                <small th:text="${#temporals.format(selectedDate, 'EEEE')}"></small>
            </div>
        </div>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-danger" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <div th:if="${#lists.isEmpty(slots)}" style="text-align: center; padding: 80px 20px; color: #adb5bd;">
            <h3>Chưa có khung giờ nào</h3>
            <p>Sử dụng công cụ bên trái để thiết lập lịch cho sân.</p>
        </div>

        <div class="slot-container">
            <div th:each="s : ${slots}" th:class="'slot-box status-' + ${s.status}" th:id="'slot-' + ${s.id}">
                <div class="slot-time">
                    <span th:text="${s.startTime}"></span> - <span th:text="${s.endTime}"></span>
                </div>
                
                <div style="position: relative;">
                    <input type="number" class="price-input-quick" 
                           th:value="${#numbers.formatDecimal(s.price, 0, 0)}" 
                           th:onchange="'updateQuickSlot(' + ${facility.id} + ',' + ${field.id} + ',' + ${s.id} + ', this.value, null)'" />
                    <small style="font-size: 9px; color: #888;">VNĐ</small>
                </div>
                
                <select class="status-select-quick" 
                        th:onchange="'updateQuickSlot(' + ${facility.id} + ',' + ${field.id} + ',' + ${s.id} + ', null, this.value)'">
                    <option value="AVAILABLE" th:selected="${s.status.name() == 'AVAILABLE'}">Sẵn sàng</option>
                    <option value="MAINTENANCE" th:selected="${s.status.name() == 'MAINTENANCE'}">Bảo trì</option>
                    <option value="LOCKED" th:selected="${s.status.name() == 'LOCKED'}">Khóa</option>
                    <option value="BOOKED" th:selected="${s.status.name() == 'BOOKED'}" disabled>Đã đặt</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script>
function updateQuickSlot(facId, fieldId, slotId, price, status) {
    const token = document.querySelector('meta[name="_csrf"]').content;
    const header = document.querySelector('meta[name="_csrf_header"]').content;
    const slotEl = document.getElementById('slot-' + slotId);

    // Xây dựng URL cập nhật
    let url = `/owner/facilities/${facId}/fields/${fieldId}/slots/${slotId}/update?`;
    if (price !== null) url += `price=${price}`;
    if (status !== null) url += (price !== null ? '&' : '') + `status=${status}`;

    fetch(url, {
        method: 'POST',
        headers: {
            [header]: token
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // Nếu đổi trạng thái, reload trang để cập nhật màu sắc Card
            if (status !== null) {
                window.location.reload();
            } else {
                // Nếu chỉ đổi giá, hiện hiệu ứng nháy xanh thành công
                slotEl.classList.add('save-success');
                setTimeout(() => slotEl.classList.remove('save-success'), 1000);
            }
        } else {
            alert("Lỗi: " + data.message);
            window.location.reload();
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert("Không thể cập nhật khung giờ.");
    });
}
</script>

</body>
</html>
