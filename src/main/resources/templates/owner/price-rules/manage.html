<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: layout(~{::title}, ~{::content})}">
<head><title>Quản lý giá</title></head>
<body>
<th:block th:fragment="content">
    <div class="container py-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/owner/facilities}">Cơ sở của tôi</a></li>
                <li class="breadcrumb-item">
                    <a th:href="@{/owner/facilities/{id}/fields(id=${facility.id})}"
                       th:text="${facility.name}"></a>
                </li>
                <li class="breadcrumb-item active" th:text="'Giá – ' + ${field.name}"></li>
            </ol>
        </nav>

        <h4 class="mb-3">Quy tắc giá – <span th:text="${field.name}"></span></h4>
        <p class="text-muted">Giá cơ sở:
            <strong th:text="${#numbers.formatDecimal(field.pricePerHour,0,'COMMA',0,'POINT') + '₫/giờ'}"></strong>
            (áp dụng khi không có rule nào khớp)
        </p>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>

        <!-- Danh sách rule -->
        <table class="table table-bordered mb-4">
            <thead class="table-light">
            <tr>
                <th>Tên quy tắc</th><th>Loại ngày</th>
                <th>Giờ áp dụng</th><th>Giá/giờ</th>
                <th>Ưu tiên</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(rules)}">
                <td colspan="6" class="text-center text-muted">Chưa có quy tắc giá nào</td>
            </tr>
            <tr th:each="r : ${rules}">
                <td th:text="${r.name}"></td>
                <td th:text="${r.dayType.displayName}"></td>
                <td th:text="${r.startTime + ' – ' + r.endTime}"></td>
                <td th:text="${#numbers.formatDecimal(r.pricePerHour,0,'COMMA',0,'POINT') + '₫'}"></td>
                <td th:text="${r.priority}"></td>
                <td>
                    <form th:action="@{/owner/facilities/{fid}/fields/{fldid}/price-rules/{rid}/delete
                            (fid=${facility.id},fldid=${field.id},rid=${r.id})}"
                          method="post">
                        <button class="btn btn-danger btn-sm"
                                onclick="return confirm('Xóa quy tắc này?')">Xóa</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Form thêm rule -->
        <div class="card">
            <div class="card-header">Thêm quy tắc giá mới</div>
            <div class="card-body">
                <form th:action="@{/owner/facilities/{fid}/fields/{fldid}/price-rules/create
                        (fid=${facility.id},fldid=${field.id})}"
                      method="post" th:object="${newRule}">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Tên quy tắc *</label>
                            <input th:field="*{name}" class="form-control" placeholder="VD: Giờ cao điểm tối">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Loại ngày *</label>
                            <select th:field="*{dayType}" class="form-select">
                                <option th:each="dt : ${dayTypes}"
                                        th:value="${dt}" th:text="${dt.displayName}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Từ *</label>
                            <input type="time" th:field="*{startTime}" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Đến *</label>
                            <input type="time" th:field="*{endTime}" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Giá/giờ (₫) *</label>
                            <input type="number" th:field="*{pricePerHour}" class="form-control" min="1000">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Ưu tiên</label>
                            <input type="number" th:field="*{priority}" class="form-control" value="0" min="0">
                        </div>
                    </div>
                    <div class="mt-3">
                        <p class="text-muted small mb-1">
                            <strong>Lưu ý:</strong> Khi nhiều rule cùng áp dụng cho một khung giờ, rule có số ưu tiên cao hơn sẽ được dùng.
                        </p>
                        <button type="submit" class="btn btn-primary">Thêm quy tắc</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
