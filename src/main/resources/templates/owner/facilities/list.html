<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Facilities</title>
    
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-create {
            background-color: #28a745;
            color: white;
        }

        .btn-edit {
            background-color: #007bff;
            color: white;
        }

        .btn-toggle {
            background-color: #ffc107;
            color: black;
        }

        .btn-field {
            background-color: #6c757d;
            color: white;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 10px;
            border: 1px solid #dee2e6;
            text-align: left;
            font-size: 14px;
            vertical-align: middle;
        }

        th {
            background-color: #343a40;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .status-active {
            color: green;
            font-weight: bold;
        }

        .status-inactive {
            color: red;
            font-weight: bold;
        }

        .message {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .actions a,
        .actions form,
        .actions button {
            display: inline-block;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .facility-img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        
        .no-img {
            color: #999;
            font-size: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>

<h2>Facility List</h2>

<div class="top-bar">
    <div></div>
    <a th:href="@{/owner/facilities/create}" class="btn btn-create">Create New Facility</a>
</div>

<div class="message success" th:if="${successMsg}" th:text="${successMsg}"></div>
<div class="message error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

<table>
    <thead>
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Address</th>
            <th>City</th>
            <th>Phone</th>
            <th>Open Time</th>
            <th>Close Time</th>
            <th>Status</th>
            <th style="width: 320px;">Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="f : ${facilities}">
            <td>
                <img th:if="${f.getPrimaryImageUrl() != null}" th:src="${f.getPrimaryImageUrl()}" alt="Image" class="facility-img" />
                <span th:unless="${f.getPrimaryImageUrl() != null}" class="no-img">No Image</span>
            </td>
            
            <td th:text="${f.name}"></td>
            <td th:text="${f.address}"></td>
            <td th:text="${f.city}"></td>
            <td th:text="${f.phone}"></td>
            <td th:text="${f.openTime}"></td>
            <td th:text="${f.closeTime}"></td>

            <td class="status-cell">
                <span th:if="${f.isActive}" class="status-active">Active</span>
                <span th:if="${!f.isActive}" class="status-inactive">Inactive</span>
            </td>

            <td class="actions">
                <a th:href="@{/owner/facilities/{id}/edit(id=${f.id})}" class="btn btn-edit">Edit</a>

                <button type="button" class="btn btn-toggle" th:onclick="'toggleFacility(' + ${f.id} + ', this)'">Toggle</button>

                <a th:href="@{/owner/facilities/{id}/fields(id=${f.id})}" class="btn btn-field">Fields</a>

                <form th:action="@{/owner/facilities/{id}/delete(id=${f.id})}" method="post" 
                      onsubmit="return confirm('Are you sure you want to delete this facility? All fields and images will be permanently lost!');"
                      style="display: inline-block;">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-delete">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<script th:inline="javascript">
    function toggleFacility(facilityId, btnElement) {

        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

 
        fetch('/owner/facilities/' + facilityId + '/toggle', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            }
        })
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
        })
        .then(data => {
            if (data.success) {

                const row = btnElement.closest('tr');
                const statusCell = row.querySelector('.status-cell');
                
                if (data.isActive) {
                    statusCell.innerHTML = '<span class="status-active">Active</span>';
                } else {
                    statusCell.innerHTML = '<span class="status-inactive">Inactive</span>';
                }
            } else {
                alert("Error: " + (data.message || "Unknown error"));
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Failed to toggle status. Please check your connection or permissions.");
        });
    }
</script>

</body>
</html>
