<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activeTab)" class="h-screen w-64 fixed left-0 top-0 z-50 bg-slate-950 flex flex-col py-6 shadow-2xl">

    <div class="px-6 mb-8 flex items-center gap-3 shrink-0">
        <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">bolt</span>
        </div>
        <div>
            <h1 class="font-headline font-black text-white text-lg leading-tight uppercase tracking-tighter">Arena Manager</h1>
            <p class="text-[10px] text-slate-500 font-label tracking-widest uppercase">Khu phức hợp Thể thao</p>
        </div>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto no-scrollbar pb-4">

        <a th:href="@{/owner}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'dashboard'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/owner/notifications}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'notifications'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            <span>Thông báo</span>
        </a>

        <a th:href="@{/owner/bookings}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'bookings'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
            <span>Đơn đặt sân</span>
        </a>

        <a th:href="@{/owner/facilities}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'facilities'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="stadium">stadium</span>
            <span>Sân / Facilities</span>
        </a>

        <a th:href="@{/owner/customers}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'customers'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="groups">groups</span>
            <span>Khách hàng</span>
        </a>

        <a th:href="@{/owner/pricing}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'pricing'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="local_offer">local_offer</span>
            <span>Giá & khuyến mãi</span>
        </a>

        <a th:href="@{/owner/reports}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'reports'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="analytics">analytics</span>
            <span>Báo cáo</span>
        </a>

        <a th:href="@{/owner/staff}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'staff'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="badge">badge</span>
            <span>Nhân viên</span>
        </a>

        <a th:href="@{/owner/payments}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'payments'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="payments">payments</span>
            <span>Thanh toán</span>
        </a>

        <a th:href="@{/owner/settings}"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none"
           th:classappend="${activeTab == 'settings'} ? 'bg-orange-600 text-white shadow-[0_10px_20px_rgba(176,47,0,0.3)]' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'">
            <span class="material-symbols-outlined" data-icon="settings">settings</span>
            <span>Cài đặt</span>
        </a>
    </nav>

    <div class="mt-auto px-4 pt-4 shrink-0 border-t border-slate-800">
        <a class="text-slate-400 hover:text-white px-4 py-2 flex items-center gap-3 text-sm transition-all text-decoration-none mb-1" href="#">
            <span class="material-symbols-outlined" data-icon="contact_support">contact_support</span>
            <span>Trung tâm hỗ trợ</span>
        </a>

        <form th:action="@{/auth/logout}" method="post" class="m-0 w-full">
            <button type="submit" class="w-full text-left text-slate-400 hover:text-red-400 px-4 py-2 flex items-center gap-3 text-sm transition-all bg-transparent border-none cursor-pointer font-['Inter']">
                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                <span>Đăng xuất</span>
            </button>
        </form>
    </div>
</aside>

</body>
</html>
