<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login — SportBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="container" style="max-width:440px;">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-decoration-none">
            <h2 class="fw-bold text-primary"><i class="bi bi-trophy-fill me-2"></i>SportBooking</h2>
        </a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="card-title fw-bold mb-4 text-center">Welcome back</h4>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-triangle me-2"></i>Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2">
                <i class="bi bi-check-circle me-2"></i>You have been logged out.
            </div>
            <div th:if="${successMsg}" class="alert alert-success py-2"
                 th:text="${successMsg}"></div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="you@email.com" required/>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-medium">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password"
                               class="form-control" placeholder="••••••••" required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <hr class="my-4"/>
            <p class="text-center mb-0 text-muted">
                Don't have an account?
                <a th:href="@{/auth/register}" class="text-primary fw-medium">Register</a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
