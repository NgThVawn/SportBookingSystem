<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Register — SportBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">
<div class="container" style="max-width:500px;">
    <div class="text-center mb-4">
        <a th:href="@{/}" class="text-decoration-none">
            <h2 class="fw-bold text-primary"><i class="bi bi-trophy-fill me-2"></i>SportBooking</h2>
        </a>
    </div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h4 class="card-title fw-bold mb-4 text-center">Create Account</h4>

            <div th:if="${errorMsg}" class="alert alert-danger py-2"
                 th:text="${errorMsg}"></div>

            <form th:action="@{/auth/register}" method="post"
                  th:object="${registerRequest}" novalidate>

                <div class="mb-3">
                    <label class="form-label fw-medium">Full Name</label>
                    <input type="text" th:field="*{fullName}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                           class="form-control" placeholder="John Doe"/>
                    <div class="invalid-feedback" th:errors="*{fullName}">Name error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                           class="form-control" placeholder="you@email.com"/>
                    <div class="invalid-feedback" th:errors="*{email}">Email error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Phone</label>
                    <input type="tel" th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                           class="form-control" placeholder="0901234567"/>
                    <div class="invalid-feedback" th:errors="*{phone}">Phone error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Password</label>
                    <input type="password" th:field="*{password}"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                           class="form-control" placeholder="Min 8 characters"/>
                    <div class="invalid-feedback" th:errors="*{password}">Password error</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium">Confirm Password</label>
                    <input type="password" th:field="*{confirmPassword}"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                           class="form-control" placeholder="Repeat password"/>
                    <div class="invalid-feedback" th:errors="*{confirmPassword}">Error</div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" th:field="*{registerAsOwner}"
                           class="form-check-input" id="ownerCheck"/>
                    <label for="ownerCheck" class="form-check-label">
                        Register as a Facility Owner
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>

            <hr class="my-4"/>
            <p class="text-center mb-0 text-muted">
                Already have an account?
                <a th:href="@{/auth/login}" class="text-primary fw-medium">Sign In</a>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
