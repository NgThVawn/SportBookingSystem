<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${facility.name + ' — SportBooking'}">Facility — SportBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div th:replace="~{fragments/base :: alerts}"></div>

<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/facilities}">Facilities</a></li>
            <li class="breadcrumb-item active" th:text="${facility.name}"></li>
        </ol>
    </nav>

    <div class="row g-4">
        <!-- Left: Facility Info -->
        <div class="col-lg-8">
            <!-- Hero Image -->
            <img th:src="${facility.primaryImageUrl != null ? facility.primaryImageUrl : '/images/default-facility.jpg'}"
                 class="w-100 rounded-3 mb-3" style="height:320px;object-fit:cover;" alt="Facility"/>

            <!-- Info header -->
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h2 class="fw-bold" th:text="${facility.name}"></h2>
                    <p class="text-muted mb-0">
                        <i class="bi bi-geo-alt me-1"></i>
                        <span th:text="${facility.address + ', ' + facility.city}"></span>
                    </p>
                </div>
                <div class="text-end">
                    <span class="fs-4 fw-bold text-warning">
                        <i class="bi bi-star-fill me-1"></i>
                        <span th:text="${facility.avgRating}"></span>
                    </span>
                    <p class="text-muted small mb-0">
                        <span th:text="${facility.reviewCount}"></span> reviews
                    </p>
                </div>
            </div>

            <!-- Contact info -->
            <div class="row g-2 mb-4">
                <div class="col-auto" th:if="${facility.phone}">
                    <span class="badge bg-light text-dark border">
                        <i class="bi bi-telephone me-1"></i><span th:text="${facility.phone}"></span>
                    </span>
                </div>
                <div class="col-auto">
                    <span class="badge bg-light text-dark border">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="${facility.openTime + ' – ' + facility.closeTime}"></span>
                    </span>
                </div>
            </div>

            <!-- Description -->
            <div class="mb-4" th:if="${facility.description}">
                <h5 class="fw-bold">About</h5>
                <p class="text-muted" th:text="${facility.description}"></p>
            </div>

            <!-- Fields / Courts -->
            <h5 class="fw-bold mb-3">
                <i class="bi bi-grid me-2"></i>Available Courts
            </h5>

            <!-- Date picker -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <div class="row align-items-center g-2">
                        <div class="col-auto fw-medium">Select Date:</div>
                        <div class="col-auto">
                            <input type="date" id="globalDate" class="form-control"
                                   th:value="${selectedDate}"
                                   th:min="${today}"/>
                        </div>
                    </div>
                </div>
            </div>

            <div class="accordion" id="fieldsAccordion">
                <div class="accordion-item border-0 shadow-sm mb-2 rounded-3"
                     th:each="field, iStat : ${fields}">
                    <h2 class="accordion-header">
                        <button class="accordion-button fw-semibold"
                                th:classappend="${field.status.name() != 'OPEN'} ? 'collapsed'"
                                type="button" data-bs-toggle="collapse"
                                th:data-bs-target="'#field-' + ${field.id}">
                            <span class="me-2"
                                  th:text="${field.name + ' — ' + field.sportType.displayName}"></span>
                            <span class="badge ms-2"
                                  th:classappend="${field.status.name() == 'OPEN'} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${field.status}"></span>
                        </button>
                    </h2>
                    <div th:id="'field-' + ${field.id}" class="accordion-collapse collapse"
                         th:classappend="${iStat.index == 0 && field.status.name() == 'OPEN'} ? 'show'">
                        <div class="accordion-body">
                            <div class="row g-2 mb-3">
                                <div class="col-auto">
                                    <span class="badge bg-info-subtle text-info">
                                        <span th:text="${field.surfaceType ?: 'Standard'}"></span>
                                    </span>
                                </div>
                                <div class="col-auto">
                                    <strong class="text-primary"
                                            th:text="${#numbers.formatDecimal(field.pricePerHour,0,'COMMA',0,'POINT') + ' VND/hr'}">
                                    </strong>
                                </div>
                            </div>

                            <!-- Slot grid (loaded via JS) -->
                            <div class="slot-grid" th:id="'slots-' + ${field.id}"
                                 th:data-field-id="${field.id}">
                                <div class="text-center text-muted py-3">
                                    <div class="spinner-border spinner-border-sm me-2"></div>
                                    Loading slots...
                                </div>
                            </div>

                            <!-- Book button -->
                            <form sec:authorize="isAuthenticated()"
                                  th:action="@{/booking/create}" method="post"
                                  th:id="'bookForm-' + ${field.id}" class="mt-3">
                                <input type="hidden" name="facilityId" th:value="${facility.id}"/>
                                <div class="selected-slots-container"
                                     th:id="'selectedSlots-' + ${field.id}"></div>
                                <div class="row align-items-end g-2">
                                    <div class="col-md-5">
                                        <label class="form-label small fw-medium">Voucher Code</label>
                                        <input type="text" name="voucherCode"
                                               class="form-control form-control-sm"
                                               placeholder="Optional voucher code"/>
                                    </div>
                                    <div class="col-md-7">
                                        <label class="form-label small fw-medium">Notes</label>
                                        <input type="text" name="notes"
                                               class="form-control form-control-sm"
                                               placeholder="Any special requests..."/>
                                    </div>
                                </div>
                                <div class="mt-3 d-flex gap-2">
                                    <button type="submit" class="btn btn-success fw-semibold"
                                            th:disabled="${field.status.name() != 'OPEN'}">
                                        <i class="bi bi-calendar-check me-1"></i>Book Selected Slots
                                    </button>
                                    <span class="text-muted my-auto small"
                                          th:id="'totalPrice-' + ${field.id}">
                                        Select slots above
                                    </span>
                                </div>
                            </form>

                            <div sec:authorize="!isAuthenticated()" class="alert alert-info mt-3 py-2">
                                <i class="bi bi-info-circle me-2"></i>
                                <a th:href="@{/auth/login}">Sign in</a> to book this court.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Reviews -->
            <h5 class="fw-bold mt-5 mb-3">
                <i class="bi bi-chat-quote me-2"></i>Reviews
                <span class="badge bg-secondary ms-2 fs-6" th:text="${#lists.size(reviews)}"></span>
            </h5>

            <div th:if="${#lists.isEmpty(reviews)}" class="text-muted">
                No reviews yet. Be the first!
            </div>

            <div class="card border-0 shadow-sm mb-3" th:each="r : ${reviews}">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <div>
                            <strong th:text="${r.user.fullName}"></strong>
                            <span class="text-muted small ms-2"
                                  th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy')}"></span>
                        </div>
                        <div class="text-warning">
                            <th:block th:each="i : ${#numbers.sequence(1, r.rating)}">
                                <i class="bi bi-star-fill"></i>
                            </th:block>
                            <th:block th:each="i : ${#numbers.sequence(r.rating + 1, 5)}">
                                <i class="bi bi-star"></i>
                            </th:block>
                        </div>
                    </div>
                    <p class="mt-2 mb-1" th:text="${r.comment}"></p>
                    <div th:if="${r.ownerReply}" class="ms-3 mt-2 p-2 bg-light rounded">
                        <small class="text-muted fw-medium">Owner reply:</small>
                        <p class="mb-0 small" th:text="${r.ownerReply}"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Services sidebar -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm sticky-top" style="top:1rem;">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">
                        <i class="bi bi-bag me-2"></i>Add-on Services
                    </h6>
                    <div th:if="${#lists.isEmpty(services)}" class="text-muted small">
                        No extra services available.
                    </div>
                    <div th:each="svc : ${services}" class="d-flex justify-content-between mb-2">
                        <span th:text="${svc.name}"></span>
                        <span class="text-primary fw-medium"
                              th:text="${#numbers.formatDecimal(svc.price,0,'COMMA',0,'POINT') + ' VND'}">
                        </span>
                    </div>

                    <hr/>
                    <div class="text-muted small">
                        <i class="bi bi-shield-check me-1 text-success"></i>
                        No double-booking guarantee<br/>
                        <i class="bi bi-arrow-counterclockwise me-1 text-info"></i>
                        Free cancellation before slot time
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/booking.js}"></script>
<script th:inline="javascript">
    const facilityId = [[${facility.id}]];
    const today = [[${today.toString()}]];
    const initialDate = [[${selectedDate.toString()}]];
    const initialFieldId = [[${selectedFieldId}]];
    document.addEventListener('DOMContentLoaded', () => {
        initBooking(initialDate, initialFieldId);
    });
</script>
</body>
</html>
