<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Browse Courts — SportBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div th:replace="~{fragments/base :: alerts}"></div>

<div class="container py-4">

    <!-- Search bar -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/facilities}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label fw-medium small">Facility Name</label>
                    <input type="text" name="name" class="form-control"
                           placeholder="Search name..." th:value="${searchName}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-medium small">City</label>
                    <input type="text" name="city" class="form-control"
                           placeholder="e.g. Ho Chi Minh" th:value="${selectedCity}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-medium small">Sport Type</label>
                    <select name="sport" class="form-select">
                        <option value="">All Sports</option>
                        <option th:each="s : ${sportTypes}"
                                th:value="${s.name()}"
                                th:text="${s.displayName}"
                                th:selected="${s == selectedSport}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">
                        <i class="bi bi-search"></i>
                    </button>
                    <a th:href="@{/facilities}" class="btn btn-outline-secondary">
                        <i class="bi bi-x"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Results header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">
            <span th:text="${facilities.totalElements}">0</span> facilities found
        </h5>
    </div>

    <!-- Facility Grid -->
    <div class="row g-4" th:if="${!facilities.isEmpty()}">
        <div class="col-md-6 col-lg-4" th:each="f : ${facilities.content}">
            <div class="card h-100 shadow-sm border-0 facility-card">
                <div class="position-relative">
                    <img th:src="${f.primaryImageUrl != null ? f.primaryImageUrl : '/images/default-facility.jpg'}"
                         class="card-img-top" style="height:200px;object-fit:cover;" alt="Facility"/>
                    <span class="position-absolute top-0 end-0 m-2 badge bg-warning text-dark">
                        <i class="bi bi-star-fill me-1"></i>
                        <span th:text="${f.avgRating}"></span>
                    </span>
                </div>
                <div class="card-body">
                    <h6 class="card-title fw-bold" th:text="${f.name}">Name</h6>
                    <p class="text-muted small mb-2">
                        <i class="bi bi-geo-alt me-1"></i>
                        <span th:text="${f.address + ', ' + f.city}"></span>
                    </p>
                    <div class="d-flex flex-wrap gap-1 mb-2">
                        <span class="badge bg-primary-subtle text-primary small"
                              th:each="field : ${f.fields}"
                              th:if="${field.status.name() == 'OPEN'}"
                              th:text="${field.sportType.displayName}"></span>
                    </div>
                    <p class="small text-muted mb-0">
                        <i class="bi bi-clock me-1"></i>
                        <span th:text="${f.openTime + ' – ' + f.closeTime}"></span>
                    </p>
                </div>
                <div class="card-footer bg-transparent border-top-0">
                    <a th:href="@{/facilities/{id}(id=${f.id})}"
                       class="btn btn-primary w-100">
                        <i class="bi bi-calendar-plus me-1"></i>View &amp; Book
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${facilities.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-building-x display-1 text-secondary"></i>
        <h5 class="mt-3">No facilities found</h5>
        <p>Try changing your filters.</p>
    </div>

    <!-- Pagination -->
    <nav th:if="${facilities.totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${facilities.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/facilities(page=${facilities.number - 1}, city=${selectedCity}, sport=${selectedSport}, name=${searchName})}">
                    &laquo;
                </a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, facilities.totalPages - 1)}"
                th:classappend="${i == facilities.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/facilities(page=${i}, city=${selectedCity}, sport=${selectedSport}, name=${searchName})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${facilities.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/facilities(page=${facilities.number + 1}, city=${selectedCity}, sport=${selectedSport}, name=${searchName})}">
                    &raquo;
                </a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/base :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
