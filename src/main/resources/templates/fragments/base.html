<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:replace="~{:: title}">SportBooking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link th:href="@{/css/app.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

<!-- ─── Navbar ─────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
            <i class="bi bi-trophy-fill me-1"></i>SportBooking
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/facilities}">
                        <i class="bi bi-search me-1"></i>Browse Courts
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <!-- Guest -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/auth/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/auth/register}">Register</a>
                </li>

                <!-- Authenticated -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/booking/history}">
                        <i class="bi bi-calendar-check me-1"></i>My Bookings
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('OWNER','ADMIN')">
                    <a class="nav-link" th:href="@{/owner/dashboard}">
                        <i class="bi bi-building me-1"></i>Owner
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        <i class="bi bi-shield-lock me-1"></i>Admin
                    </a>
                </li>

                <!-- Notifications -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link position-relative" th:href="@{/profile/notifications}">
                        <i class="bi bi-bell fs-5"></i>
                    </a>
                </li>

                <!-- Profile dropdown -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-1"
                       href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span sec:authentication="name" class="d-none d-md-inline small"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/profile}">
                            <i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"/></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post">
                                <button class="dropdown-item text-danger" type="submit">
                                    <i class="bi bi-box-arrow-right me-2"></i>Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ─── Flash Messages ─────────────────────────────────────────────── -->
<div th:fragment="alerts" class="container mt-3">
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ─── Footer ─────────────────────────────────────────────────────── -->
<footer th:fragment="footer" class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <p class="mb-1 fw-semibold">
            <i class="bi bi-trophy-fill me-1 text-warning"></i>SportBooking
        </p>
        <small class="text-secondary">&copy; 2026 SportBooking. All rights reserved.</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="~{:: scripts}"></th:block>
</body>
</html>
