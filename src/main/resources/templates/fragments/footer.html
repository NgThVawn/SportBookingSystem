<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<footer th:fragment="footer" class="w-full py-12 px-6 mt-auto bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
    <div class="flex flex-col md:flex-row justify-between items-center gap-6 max-w-7xl mx-auto">

        <div class="text-lg font-bold text-slate-900 dark:text-white font-headline">
            ARENA KINETIC
        </div>

        <div class="flex flex-wrap justify-center gap-8">
            <a th:href="@{/terms}" class="text-slate-500 hover:text-orange-500 font-['Inter'] text-sm tracking-wide transition-all opacity-80 hover:opacity-100">Terms of Service</a>
            <a th:href="@{/privacy}" class="text-slate-500 hover:text-orange-500 font-['Inter'] text-sm tracking-wide transition-all opacity-80 hover:opacity-100">Privacy Policy</a>
            <a th:href="@{/support}" class="text-slate-500 hover:text-orange-500 font-['Inter'] text-sm tracking-wide transition-all opacity-80 hover:opacity-100">Contact Support</a>
            <a th:href="@{/partners}" class="text-slate-500 hover:text-orange-500 font-['Inter'] text-sm tracking-wide transition-all opacity-80 hover:opacity-100">Venue Partners</a>
        </div>

        <div class="text-slate-500 font-['Inter'] text-xs tracking-wide opacity-60">
            &copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> ARENA KINETIC. PRECISION IN MOTION.
        </div>

    </div>
</footer>

</body>
</html>
