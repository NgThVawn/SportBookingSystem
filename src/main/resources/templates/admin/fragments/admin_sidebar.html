<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activeTab)" class="h-screen w-64 fixed left-0 top-0 z-50 bg-slate-950 flex flex-col py-6 shadow-2xl">

    <div class="px-6 mb-8 flex items-center gap-3 shrink-0">
        <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">shield</span>
        </div>
        <div>
            <h1 class="font-headline font-black text-white text-lg leading-tight uppercase tracking-tighter">Admin Console</h1>
            <p class="text-[10px] text-slate-500 font-label tracking-widest uppercase">Quản trị hệ thống</p>
        </div>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto no-scrollbar pb-4">
        <a th:href="@{/admin}"
              th:classappend="${activeTab == 'dashboard'} ? ' bg-orange-600 text-white' : ' text-slate-300 hover:bg-slate-800 hover:text-white'"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none">
            <span class="material-symbols-outlined text-[20px]">dashboard</span>
            <span>Tổng quan</span>
        </a>

        <a th:href="@{/admin/users}"
              th:classappend="${activeTab == 'users'} ? ' bg-orange-600 text-white' : ' text-slate-300 hover:bg-slate-800 hover:text-white'"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none">
            <span class="material-symbols-outlined text-[20px]">group</span>
            <span>Người dùng</span>
        </a>

        <a th:href="@{/admin/facilities}"
              th:classappend="${activeTab == 'facilities'} ? ' bg-orange-600 text-white' : ' text-slate-300 hover:bg-slate-800 hover:text-white'"
           class="mx-2 my-1 px-4 py-3 flex items-center gap-3 font-['Inter'] text-sm font-medium hover:translate-x-1 transition-all duration-300 rounded-lg text-decoration-none">
            <span class="material-symbols-outlined text-[20px]">stadium</span>
            <span>Cơ sở</span>
        </a>
    </nav>

    <form th:action="@{/auth/logout}" method="post" class="mx-4 mt-auto">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit"
                class="w-full rounded-xl bg-slate-900 border border-slate-800 px-4 py-3 text-left text-white font-semibold hover:bg-slate-800 transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-[20px]">logout</span>
            <span>Đăng xuất</span>
        </button>
    </form>

</aside>

</body>
</html>
