<th:block th:fragment="sharedScript">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

        async function fetchWithCsrf(url, options = {}) {
            const headers = { ...options.headers };
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
            return fetch(url, { ...options, headers });
        }

        async function loadNotifications() {
            const res = await fetch('/api/notifications');
            if (!res.ok) return;
            const notifications = await res.json();
            renderList(notifications);
        }

        function renderList(notifications) {
            // Lấy Container hiện đang active trên màn hình
            const container = document.querySelector('.notif-list-container');
            if (!container) return;

            if (!notifications.length) {
                container.innerHTML = '<div class="bg-surface-container-lowest p-12 rounded-2xl border border-slate-100 shadow-sm text-center mt-10"><span class="material-symbols-outlined text-5xl text-slate-300 mb-4">notifications_paused</span><h4 class="font-headline font-bold text-xl mb-2">Hộp thư trống</h4><p class="text-slate-500">Chưa có thông báo nào từ hệ thống.</p></div>';
                return;
            }
            
            container.innerHTML = notifications.map(n => `
            <div class="notif-item flex items-start gap-4 p-5 rounded-2xl border cursor-pointer transition-all hover:shadow-md
                        ${n.read ? 'bg-surface-container-lowest border-slate-100' : 'bg-orange-50/50 border-orange-200'}"
                 data-id="${n.id}" data-link="${n.link || ''}"
                 onclick="handleClick(this)">
                <div class="flex-shrink-0 w-3 h-3 mt-1.5 rounded-full ${n.read ? 'bg-transparent' : 'bg-primary animate-pulse'}"></div>
                <div class="flex-1 min-w-0">
                    <div class="font-bold text-base text-on-surface font-headline">${escapeHtml(n.title)}</div>
                    <div class="text-sm text-slate-600 mt-1 font-body leading-relaxed">${escapeHtml(n.message)}</div>
                    <div class="text-xs text-slate-400 font-label mt-2 flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">schedule</span> ${formatTime(n.createdAt)}
                    </div>
                </div>
            </div>
            `).join('');
        }

        async function handleClick(el) {
            const id = el.dataset.id;
            const link = el.dataset.link;
            await fetchWithCsrf('/api/notifications/' + id + '/read', { method: 'PUT' });
            if (link && link !== 'null') window.location.href = link;
            else loadNotifications();
        }

        async function markAllAsRead() {
            await fetchWithCsrf('/api/notifications/read-all', { method: 'PUT' });
            const badge = document.getElementById('notif-badge');
            if (badge) badge.style.display = 'none';
            loadNotifications();
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('vi-VN', { dateStyle: 'short', timeStyle: 'short' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text || ''));
            return div.innerHTML;
        }

        loadNotifications();
        /*]]>*/
    </script>
</th:block>
