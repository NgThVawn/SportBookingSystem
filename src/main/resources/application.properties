spring.application.name=SportBooingSystem

# Tải thêm secrets từ application-local.properties nếu tồn tại (gitignored)
# Sao chép application-local.properties.example thành application-local.properties
# để chạy local mà không commit secrets lên Git
spring.config.import=optional:classpath:application-local.properties

# --------------------------------------------------------------
# Database
# --------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/sport_booking?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10

# --------------------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/data.sql
spring.jpa.defer-datasource-initialization=true

# --------------------------------------------------------------
# Thymeleaf
# --------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# --------------------------------------------------------------
# File Upload
# --------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --------------------------------------------------------------
# VNPay – secrets được override bởi application-local.properties
# --------------------------------------------------------------
vnpay.tmn-code=${VNPAY_TMN_CODE:PLACEHOLDER}
vnpay.hash-secret=${VNPAY_HASH_SECRET:PLACEHOLDER}
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/payment/vnpay-return

# --------------------------------------------------------------
# MoMo – secrets được override bởi application-local.properties
# --------------------------------------------------------------
momo.partner-code=${MOMO_PARTNER_CODE:PLACEHOLDER}
momo.access-key=${MOMO_ACCESS_KEY:PLACEHOLDER}
momo.secret-key=${MOMO_SECRET_KEY:PLACEHOLDER}
momo.payment-url=https://test-payment.momo.vn/v2/gateway/api/create
momo.return-url=http://localhost:8080/payment/momo-return
momo.ipn-url=http://localhost:8080/payment/momo-ipn

# --------------------------------------------------------------
# Booking
# --------------------------------------------------------------
booking.payment-timeout-minutes=10

# --------------------------------------------------------------
# OAuth2 – Google (secrets override bởi application-local.properties)
# --------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:PLACEHOLDER}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:PLACEHOLDER}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# --------------------------------------------------------------
# OAuth2 – Facebook (secrets override bởi application-local.properties)
# --------------------------------------------------------------
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:PLACEHOLDER}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture.width(400)
spring.security.oauth2.client.provider.facebook.user-name-attribute=id
